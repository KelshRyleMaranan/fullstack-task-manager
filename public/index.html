<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- LOGIN / REGISTER SCREEN -->
  <section id="auth-view" class="view auth">
    <div class="auth-card">
      <h1 class="brand-title">Task Manager</h1>
      <p class="muted" id="auth-subtitle">Log in to see your tasks.</p>

      <div class="tabs">
        <a href="#login" id="tab-login" class="tab active">Log in</a>
        <a href="#register" id="tab-register" class="tab">Register</a>
      </div>

      <form id="auth-form" data-mode="login" novalidate>
        <div class="field register-only">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="60" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" />
        </div>
        <p class="form-error" id="form-error" role="alert"></p>
        <button type="submit" class="btn btn-accent btn-block" id="submit-btn">Log in</button>
      </form>
    </div>
  </section>

  <!-- APP SCREEN -->
  <div id="app-view" class="view app hidden">
    <aside class="sidebar">
      <div class="brand">Task Manager</div>

      <nav class="nav" aria-label="Task filters">
        <button type="button" class="nav-link active" data-filter="all">
          All tasks <span class="count" data-count="all">0</span>
        </button>
        <button type="button" class="nav-link" data-filter="todo">
          To-do <span class="count" data-count="todo">0</span>
        </button>
        <button type="button" class="nav-link" data-filter="in_progress">
          In progress <span class="count" data-count="in_progress">0</span>
        </button>
        <button type="button" class="nav-link" data-filter="done">
          Done <span class="count" data-count="done">0</span>
        </button>
      </nav>

      <div class="user">
        <div class="avatar" id="user-initial">?</div>
        <div class="user-info">
          <strong id="user-name"></strong>
          <span id="user-email"></span>
        </div>
        <a class="btn btn-ghost" id="logout-btn" href="#login">Log out</a>
      </div>
    </aside>

    <main class="main">
      <div class="page-head">
        <div>
          <h2>My tasks</h2>
          <p class="muted">Stay on top of what matters.</p>
        </div>
        <button type="button" class="btn btn-dark" id="new-task-btn">+ New task</button>
      </div>

      <p class="banner hidden" id="task-banner" role="alert">
        <span id="task-banner-text"></span>
        <button type="button" class="link-btn" id="retry-btn">Try again</button>
      </p>

      <div id="groups" aria-live="polite"></div>
    </main>
  </div>

  <!-- NEW / EDIT TASK POPUP -->
  <dialog id="task-dialog">
    <h2 id="dialog-title">New task</h2>
    <form id="task-form" novalidate>
      <div class="field">
        <label for="task-title">Title</label>
        <input id="task-title" type="text" maxlength="120" />
      </div>
      <div class="field">
        <label for="task-description">Description (optional)</label>
        <textarea id="task-description" maxlength="1000" rows="3"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="task-status">Status</label>
          <select id="task-status">
            <option value="todo">To-do</option>
            <option value="in_progress">In progress</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div class="field">
          <label for="task-priority">Priority</label>
          <select id="task-priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="task-due">Due date (optional)</label>
        <input id="task-due" type="date" />
      </div>
      <p class="form-error" id="task-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" id="task-cancel">Cancel</button>
        <button type="submit" class="btn btn-accent" id="task-save">Add task</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
